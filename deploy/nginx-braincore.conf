# Braincore Pro — nginx (Hetzner): api.braincore.pro + live.braincore.pro
#
#   cp deploy/nginx-braincore.conf /etc/nginx/sites-available/braincore
#   ln -s /etc/nginx/sites-available/braincore /etc/nginx/sites-enabled/braincore
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.braincore.pro -d live.braincore.pro
#
# The static site (braincore.pro, www) lives on Hostinger — it is NOT served here.
# Both subdomains point at this machine's IP in Hostinger DNS.

# ── Rate limiting (protects the zero-dependency API) ─────────────────────────
limit_req_zone $binary_remote_addr zone=braincore_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=braincore_tasks:10m rate=2r/s;

# WebSocket upgrade support for the live feed
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream braincore_api {
  server 127.0.0.1:8081;
  keepalive 32;
}

# ── api.braincore.pro ───────────────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name api.braincore.pro;

  # certbot rewrites this block to 443 after `certbot --nginx`
  location /.well-known/acme-challenge/ { root /var/www/html; }

  client_max_body_size 1m;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # CORS is handled by the app (it whitelists braincore.pro); nginx must not duplicate it.

  location / {
    limit_req zone=braincore_api burst=30 nodelay;
    proxy_pass http://braincore_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Task submission is the write path — stricter bucket
  location = /task {
    limit_req zone=braincore_tasks burst=10 nodelay;
    proxy_pass http://braincore_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Stripe webhook: no rate limit (Stripe retries), keep the body intact for signature checks
  location = /v1/stripe/webhook {
    proxy_pass http://braincore_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_request_buffering on;
    client_max_body_size 256k;
  }
}

# ── live.braincore.pro ──────────────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name live.braincore.pro;

  location /.well-known/acme-challenge/ { root /var/www/html; }

  server_tokens off;
  add_header X-Content-Type-Options nosniff always;

  # WebSocket feed — long-lived connections, no buffering
  location /events {
    proxy_pass http://braincore_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    limit_req zone=braincore_api burst=30 nodelay;
    proxy_pass http://braincore_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

