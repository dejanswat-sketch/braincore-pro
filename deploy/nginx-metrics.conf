# Braincore Pro — Grafana / metrike preko nginx-a (metrics.braincore.pro)
#
# ⚠️ NIJE AKTIVNO. Ovo je priprema: kopiraj u /etc/nginx/sites-available/braincore-metrics
#    i uključi TEK kad se Grafana digne na 3030 (deploy/grafana-setup.sh).
#
# Namjerno:
#   • Grafana sluša na 127.0.0.1:3030 (NE 3000 — taj port drži nmq-server)
#   • nginx izlaže SAMO Grafana UI; /metrics?format=prom ostaje na api.braincore.pro
#   • Basic Auth na nivou nginxa je DRUGA brava pored Grafana login-a
#
# Postupak (kad korisnik kaže „digni Grafana"):
#   1. bash deploy/grafana-setup.sh                       # Grafana na 3030
#   2. htpasswd -c /etc/nginx/.htpasswd-metrics <korisnik>   # nginx brava (traži apache2-utils)
#   3. cp ovaj fajl /etc/nginx/sites-available/braincore-metrics
#      ln -s /etc/nginx/sites-available/braincore-metrics /etc/nginx/sites-enabled/
#   4. Dodaj A zapis metrics.braincore.pro -> 62.238.35.78 (Hostinger API, kao za api/live)
#   5. nginx -t && systemctl reload nginx
#   6. certbot --nginx -d metrics.braincore.pro --redirect -m dejanswat@gmail.com --agree-tos -n
#   7. Provera: curl -I https://metrics.braincore.pro  (401 bez lozinke = brava radi)

server {
    listen 80;
    listen [::]:80;
    server_name metrics.braincore.pro;

    # ACME challenge mora ostati otvoren za certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name metrics.braincore.pro;

    # certbot --nginx popunjava ove linije; ostavljene su kao podsjetnik
    # ssl_certificate     /etc/letsencrypt/live/metrics.braincore.pro/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/metrics.braincore.pro/privkey.pem;

    access_log /var/log/nginx/braincore-metrics.access.log;
    error_log  /var/log/nginx/braincore-metrics.error.log;

    # Nema indeksiranja privatnog dashboarda
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    auth_basic           "Braincore metrics";
    auth_basic_user_file /etc/nginx/.htpasswd-metrics;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana Live (WebSocket) za osvježavanje panela
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Health bez brave (za alertcheck/monitoring)
    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3030/api/health;
        proxy_set_header Host $host;
    }
}
