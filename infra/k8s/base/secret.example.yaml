# PRIMJER — ne commitovati stvarne vrijednosti.
# Preporuka: koristi External Secrets (vidi infra/k8s/base/configmap.yaml) ili `kubectl create secret`.
#
#   kubectl -n nmq-system create secret generic nmq-robot-secrets \
#     --from-literal=NMQ_LLM_API_KEY="..." \
#     --from-literal=NMQ_MASTER_KEY="$(openssl rand -hex 32)" \
#     --from-literal=NMQ_API_KEY_PEPPER="$(openssl rand -hex 16)"
apiVersion: v1
kind: Secret
metadata:
  name: nmq-robot-secrets
  namespace: nmq-system
type: Opaque
stringData:
  # LLM provajder (DeepSeek ili OpenAI-kompatibilan) — vrijednost iz DSH store-a, nikad iz chata
  NMQ_LLM_API_KEY: 'REPLACE_ME'
  # 32-bajtni ključ (hex) za AES-256-GCM enkripciju tajni klijenata
  NMQ_MASTER_KEY: 'REPLACE_ME_openssl_rand_hex_32'
  # pepper za hash API ključeva (tenant i per-agent)
  NMQ_API_KEY_PEPPER: 'REPLACE_ME_openssl_rand_hex_16'
---
# Tajne pojedinih integracija (MCP serveri ih dobijaju kroz sandbox envAllowlist).
# Dodaj samo one koje su stvarno u upotrebi; ostale drži van klastera.
apiVersion: v1
kind: Secret
metadata:
  name: nmq-integration-secrets
  namespace: nmq-system
type: Opaque
stringData:
  SLACK_BOT_TOKEN: 'REPLACE_ME'
  NOTION_TOKEN: 'REPLACE_ME'
  GITHUB_TOKEN: 'REPLACE_ME'
  HUBSPOT_TOKEN: 'REPLACE_ME'
  SHOPIFY_TOKEN: 'REPLACE_ME'
  STRIPE_SECRET_KEY: 'REPLACE_ME'
