# NMQ Robot — svemirski namespace (jedan za cijelu platformu).
# Per-tenant izolacija ide u infra/k8s/tenant-template (namespace po klijentu).
apiVersion: v1
kind: Namespace
metadata:
  name: nmq-system
  labels:
    app.kubernetes.io/name: nmq-robot
    app.kubernetes.io/part-of: nmq-platform
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: nmq-system-quota
  namespace: nmq-system
spec:
  hard:
    requests.cpu: '4'
    requests.memory: 8Gi
    limits.cpu: '8'
    limits.memory: 16Gi
    persistentvolumeclaims: '4'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: nmq-system-limits
  namespace: nmq-system
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: '2'
        memory: 4Gi
