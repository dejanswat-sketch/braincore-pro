apiVersion: v1
kind: Service
metadata:
  name: nmq-robot
  namespace: nmq-system
  labels:
    app.kubernetes.io/name: nmq-robot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nmq-robot
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nmq-robot
  namespace: nmq-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-buffering: 'off' # SSE ne smije da se baferuje
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/limit-rps: '20'
spec:
  ingressClassName: nginx
  tls:
    - hosts: ['robot.aicommandcenter.pro']
      secretName: nmq-robot-tls
  rules:
    - host: robot.aicommandcenter.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nmq-robot
                port:
                  name: http
