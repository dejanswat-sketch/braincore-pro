# Horizontalno skaliranje.
# ⚠️ VAŽNO: scheduler u ovom trenutku koristi fajl-lease (nije distributed lock).
# Ako ideš na replicas > 1:
#   1) isključi scheduler u API podovima: NMQ_SCHEDULER=0
#   2) scheduler pokreni kao zaseban Deployment sa 1 replikom (deployment-scheduler.yaml)
#   3) za v1: Postgres advisory lock ili Redis lock (docs/14 §7)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nmq-robot
  namespace: nmq-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nmq-robot
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nmq-robot
  namespace: nmq-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nmq-robot
