# NMQ Robot — Deployment.
# Sigurnosni kontekst je namjerno strog: read-only root FS, bez privilegija, bez eskalacije,
# sve kapacitete isključene. Sandbox u kodu (src/core/sandbox.js) je DRUGI sloj, ne zamjena za ovo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nmq-robot
  namespace: nmq-system
  labels:
    app.kubernetes.io/name: nmq-robot
    app.kubernetes.io/component: api
spec:
  # MVP: 1 replika. Više replika traži distributed lock za scheduler (vidi docs/14 §7) —
  # tada se scheduler seli u zaseban Deployment sa 1 replikom (infra/k8s/base/deployment-scheduler.yaml).
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nmq-robot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nmq-robot
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: nmq-robot
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-data
          image: busybox:1.36
          command: ['sh', '-c', 'mkdir -p /data/tenants /data/_control /data/_global && chown -R 1000:1000 /data']
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: robot
          image: nmq-robot:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - configMapRef:
                name: nmq-robot-config
          env:
            - name: NMQ_HOST
              value: 0.0.0.0
            - name: NMQ_PORT
              value: '8787'
            - name: NMQ_DATA_DIR
              value: /data
            - name: NODE_ENV
              value: production
            # Tajne: imena ključeva, vrijednosti iz Secret-a (nikad u git)
            - name: NMQ_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nmq-robot-secrets
                  key: NMQ_LLM_API_KEY
            - name: NMQ_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: nmq-robot-secrets
                  key: NMQ_MASTER_KEY
            - name: NMQ_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: nmq-robot-secrets
                  key: NMQ_API_KEY_PEPPER
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nmq-robot-data
        - name: config
          configMap:
            name: nmq-robot-agents
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nmq-robot-data
  namespace: nmq-system
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 10Gi
  # storageClassName: hcloud-volumes   # Hetzner CSI (postaviti prema klasteru)
